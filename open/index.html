<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mediathek-Extractor – Link öffnen</title>
<!-- Link-Seite für geteilte Filme: öffnet die App („mediathek-extractor://…“) bzw. zeigt ohne App
     die Sender-Seite und den Download. Keine externen Dateien, kein Tracking. -->
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6576; --accent: #3a5bd9; --border: #dfe3ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --card: #1f2229; --text: #e9ecf2; --muted: #a2a9b8; --accent: #7c97ff; --border: #343844; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 460px; width: 100%; }
  .logo { font-size: 36px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p { color: var(--muted); margin: 6px 0 18px; }
  a.btn { display: block; text-align: center; padding: 11px 14px; border-radius: 9px; text-decoration: none; margin-top: 10px; border: 1px solid var(--border); color: var(--text); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  small { display: block; color: var(--muted); margin-top: 18px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo">📺</div>
  <h1 id="title">Filmtipp</h1>
  <p id="hint">Wird in Mediathek-Extractor geöffnet …</p>
  <a class="btn primary" id="app" href="#">In Mediathek-Extractor öffnen</a>
  <a class="btn" id="sender" href="#" hidden>Beim Sender ansehen</a>
  <a class="btn" id="download" href="https://github.com/7hdmm9pp2w-code/MediathekExtractor-Releases">Mediathek-Extractor herunterladen</a>
  <small>Mediathek-Extractor sucht und lädt Filme aus den Mediatheken von ARD, ZDF, ARTE, 3sat … – kostenlos für Mac, Windows und Linux.</small>
</main>
<script>
  // Gleiche Liste wie in der App (src/lib/links.ts): nur Seiten der Sender
  const ALLOWED = ["ardmediathek.de", "zdf.de", "arte.tv", "3sat.de", "kika.de", "br.de", "ndr.de", "wdr.de", "swr.de", "mdr.de", "rbb-online.de", "hr.de", "sr.de", "phoenix.de", "funk.net", "orf.at", "srf.ch"];
  const allowed = (url) => {
    try {
      const u = new URL(url);
      const host = u.hostname.toLowerCase();
      return u.protocol === "https:" && ALLOWED.some((h) => host === h || host.endsWith("." + h));
    } catch {
      return false;
    }
  };
  const params = new URLSearchParams(location.search);
  const page = params.get("seite") || "";
  const query = (params.get("q") || "").slice(0, 200);
  const title = (params.get("t") || "").slice(0, 200);
  if (title) {
    document.getElementById("title").textContent = title;
    document.title = title + " – Mediathek-Extractor";
  }
  // In der App per Titel suchen – zuverlässiger als die Sender-Seite: deren Adresse in den
  // Mediathek-Daten ist manchmal veraltet (ARD: 404), der Film selbst aber noch da
  const search = query || title;
  let appUrl = "";
  if (search) {
    appUrl = "mediathek-extractor://suche?q=" + encodeURIComponent(search);
  } else if (allowed(page)) {
    appUrl = "mediathek-extractor://seite?url=" + encodeURIComponent(page);
  }
  if (allowed(page)) {
    const sender = document.getElementById("sender");
    sender.href = page;
    sender.hidden = false;
  }
  const app = document.getElementById("app");
  if (appUrl) {
    app.href = appUrl;
    // Direkt versuchen; der Browser fragt meist nach, ob die App geöffnet werden darf
    location.href = appUrl;
    setTimeout(() => {
      document.getElementById("hint").textContent = "Nichts passiert? Dann ist Mediathek-Extractor hier nicht installiert – oder öffne den Film direkt beim Sender.";
    }, 1500);
  } else {
    app.hidden = true;
    document.getElementById("hint").textContent = "Dieser Link ist unvollständig.";
  }
</script>
</body>
</html>
